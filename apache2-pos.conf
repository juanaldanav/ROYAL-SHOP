# Apache2 reverse proxy — royalshop.lamarque.mx → Next.js :3000
# Módulos requeridos: proxy proxy_http proxy_wstunnel rewrite ssl
# Habilitar: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite ssl
#
# Pasos de instalación:
#   1. DNS: registro A  royalshop.lamarque.mx → 35.238.78.16  (en tu panel de lamarque.mx)
#   2. Copiar: sudo cp apache2-pos.conf /etc/apache2/sites-available/royalshop.conf
#   3. sudo a2ensite royalshop
#   4. sudo apache2ctl configtest && sudo systemctl reload apache2
#   5. SSL: sudo certbot --apache -d royalshop.lamarque.mx
#      (certbot edita el archivo automáticamente y agrega las líneas SSL)

<VirtualHost *:80>
    ServerName royalshop.lamarque.mx
    Redirect permanent / https://royalshop.lamarque.mx/
</VirtualHost>

<VirtualHost *:443>
    ServerName royalshop.lamarque.mx

    SSLEngine on
    # certbot llena estas líneas automáticamente:
    # SSLCertificateFile    /etc/letsencrypt/live/royalshop.lamarque.mx/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/royalshop.lamarque.mx/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket (Next.js / hot reload en dev — inofensivo en prod)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]

    ErrorLog  ${APACHE_LOG_DIR}/royalshop-error.log
    CustomLog ${APACHE_LOG_DIR}/royalshop-access.log combined
</VirtualHost>
