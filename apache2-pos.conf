# Apache2 reverse proxy config for royaleshop-pos (Next.js on :3000)
# Required modules: mod_proxy mod_proxy_http mod_proxy_wstunnel mod_rewrite mod_ssl
# Enable with: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite ssl
#
# ─────────────────────────────────────────────────────────────────────────────
# OPTION A — New subdomain: pos.soporte.lamarque.mx
# ─────────────────────────────────────────────────────────────────────────────
# Steps:
#   1. Add a DNS A record: pos.soporte.lamarque.mx → <VM public IP>
#   2. Copy this file to /etc/apache2/sites-available/pos.conf
#   3. sudo a2ensite pos
#   4. sudo apache2ctl configtest && sudo systemctl reload apache2
#   5. Obtain TLS cert:
#        sudo certbot --apache -d pos.soporte.lamarque.mx
#   6. Un-comment the SSL* lines below once the cert exists.
# ─────────────────────────────────────────────────────────────────────────────

# <VirtualHost *:80>
#     ServerName pos.soporte.lamarque.mx
#     Redirect permanent / https://pos.soporte.lamarque.mx/
# </VirtualHost>
#
# <VirtualHost *:443>
#     ServerName pos.soporte.lamarque.mx
#
#     SSLEngine on
#     # Uncomment after running certbot:
#     # SSLCertificateFile    /etc/letsencrypt/live/pos.soporte.lamarque.mx/fullchain.pem
#     # SSLCertificateKeyFile /etc/letsencrypt/live/pos.soporte.lamarque.mx/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyPass        / http://127.0.0.1:3000/
#     ProxyPassReverse / http://127.0.0.1:3000/
#
#     # WebSocket support (Next.js HMR / real-time features)
#     RewriteEngine On
#     RewriteCond %{HTTP:Upgrade} websocket [NC]
#     RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]
#
#     ErrorLog  ${APACHE_LOG_DIR}/pos-error.log
#     CustomLog ${APACHE_LOG_DIR}/pos-access.log combined
# </VirtualHost>


# ─────────────────────────────────────────────────────────────────────────────
# OPTION B — Path-based /pos on existing soporte.lamarque.mx (no new DNS)
# ─────────────────────────────────────────────────────────────────────────────
# Prerequisites:
#   - Set  basePath: '/pos'  in royale-shop/next.config.ts, then rebuild.
#   - Add the lines below INSIDE the existing soporte.lamarque.mx VirtualHost
#     on port 443 (in /etc/apache2/sites-available/soporte.lamarque.mx.conf or
#     the file certbot generated for it).
#
# Add these lines inside the existing <VirtualHost *:443> block:
#
#     ProxyPreserveHost On
#     ProxyPass        /pos http://127.0.0.1:3000
#     ProxyPassReverse /pos http://127.0.0.1:3000
#
#     # WebSocket support
#     RewriteEngine On
#     RewriteCond %{HTTP:Upgrade} websocket [NC]
#     RewriteRule /pos/(.*) ws://127.0.0.1:3000/$1 [P,L]
#
# Then: sudo apache2ctl configtest && sudo systemctl reload apache2
