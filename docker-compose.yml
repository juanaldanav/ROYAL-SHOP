---
# Lighthouse Bot — Docker Compose Stack
# Versiones pinneadas 2026-05-07 (ver WORKLOG.md para justificación)
# RAM apretada: resource limits OBLIGATORIOS, no quitar.
# NO hacer docker compose up sin llenar .env primero (ver .env.example)

networks:
  lighthouse-net:
    driver: bridge

volumes:
  lighthouse_postgres_data:
  lighthouse_redis_data:
  lighthouse_n8n_data:
  lighthouse_evolution_data:
  lighthouse_chatwoot_storage:
  lighthouse_caddy_data:
  lighthouse_caddy_config:
  lighthouse_booksy_storage:

services:

  # ---------------------------------------------------------------------------
  # POSTGRES 16 — Base de datos compartida (n8n + Chatwoot en schemas separados)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.13
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c effective_cache_size=256MB
      -c work_mem=4MB
    volumes:
      - lighthouse_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - lighthouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # REDIS 7 — Cache y state store (dedup, rate limiting, conv context, locks)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4.9
    restart: unless-stopped
    mem_limit: 128m
    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - lighthouse_redis_data:/data
    networks:
      - lighthouse-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # N8N — Orquestador de workflows (WhatsApp → intent → Booksy)
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:2.19.5
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # DB
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_db}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n_user}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Runtime
      GENERIC_TIMEZONE: ${BARBERSHOP_TIMEZONE:-America/Mazatlan}
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: https://n8n.${CADDY_DOMAIN:-localhost}:9443
      # Gemini config (disponible para code nodes en n8n)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      # Barbería
      BARBERSHOP_NAME: ${BARBERSHOP_NAME}
      BARBERSHOP_TIMEZONE: ${BARBERSHOP_TIMEZONE:-America/Mazatlan}
    volumes:
      - lighthouse_n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - lighthouse-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # EVOLUTION API v2 — Gateway WhatsApp (QR/pairing, webhooks a n8n)
  # ---------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:8001:8080"
    environment:
      # Server
      SERVER_URL: https://evolution.${CADDY_DOMAIN:-localhost}:9443
      DEL_INSTANCE: "false"
      # Auth
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Database (Postgres)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/evolution_db
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      # Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      # WhatsApp
      WA_BUSINESS_TOKEN_WEBHOOK: ${EVOLUTION_API_KEY}
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#175197"
      # Webhook
      WEBHOOK_GLOBAL_ENABLED: "false"
      # Logs
      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
    volumes:
      - lighthouse_evolution_data:/evolution/instances
    networks:
      - lighthouse-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # CHATWOOT WEB — Bandeja de conversaciones para handoff humano
  # ---------------------------------------------------------------------------
  chatwoot-web:
    image: chatwoot/chatwoot:v4.13.0
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:3001:3000"
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment:
      # DB
      DATABASE_URL: postgresql://${CHATWOOT_DB_USER:-chatwoot_user}:${CHATWOOT_DB_PASSWORD}@postgres:5432/${CHATWOOT_DB_NAME:-chatwoot_db}
      # Redis
      REDIS_URL: redis://redis:6379
      # App
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://chatwoot.${CADDY_DOMAIN:-localhost}:9443
      DEFAULT_LOCALE: es
      FORCE_SSL: "false"
      ENABLE_ACCOUNT_SIGNUP: "false"
      # Mail (desactivado por ahora)
      MAILER_SENDER_EMAIL: ""
      # Storage
      ACTIVE_STORAGE_SERVICE: local
      RAILS_ENV: production
      NODE_ENV: production
    volumes:
      - lighthouse_chatwoot_storage:/app/storage
    networks:
      - lighthouse-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # CHATWOOT SIDEKIQ — Worker de background jobs (notificaciones, webhooks)
  # ---------------------------------------------------------------------------
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.13.0
    restart: unless-stopped
    mem_limit: 256m
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      DATABASE_URL: postgresql://${CHATWOOT_DB_USER:-chatwoot_user}:${CHATWOOT_DB_PASSWORD}@postgres:5432/${CHATWOOT_DB_NAME:-chatwoot_db}
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://chatwoot.${CADDY_DOMAIN:-localhost}:9443
      RAILS_ENV: production
      NODE_ENV: production
      ACTIVE_STORAGE_SERVICE: local
    volumes:
      - lighthouse_chatwoot_storage:/app/storage
    networks:
      - lighthouse-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatwoot-web:
        condition: service_started

  # ---------------------------------------------------------------------------
  # BOOKSY EXECUTOR — Microservicio Python/Playwright para automatizar Booksy
  # ---------------------------------------------------------------------------
  booksy-executor:
    build:
      context: ./booksy-executor
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379
      BOOKSY_USERNAME_SUC1: ${BOOKSY_USERNAME_SUC1}
      BOOKSY_PASSWORD_SUC1: ${BOOKSY_PASSWORD_SUC1}
      BOOKSY_LOCATION_ID_SUC1: ${BOOKSY_LOCATION_ID_SUC1}
      BOOKSY_USERNAME_SUC2: ${BOOKSY_USERNAME_SUC2}
      BOOKSY_PASSWORD_SUC2: ${BOOKSY_PASSWORD_SUC2}
      BOOKSY_LOCATION_ID_SUC2: ${BOOKSY_LOCATION_ID_SUC2}
      BARBERSHOP_TIMEZONE: ${BARBERSHOP_TIMEZONE:-America/Mazatlan}
      LOG_LEVEL: INFO
    volumes:
      - lighthouse_booksy_storage:/app/storage_state
    networks:
      - lighthouse-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # CADDY 2 — Reverse proxy (9080/9443 únicos puertos públicos del stack)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.2
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "0.0.0.0:9080:9080"
      - "0.0.0.0:9443:9443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - lighthouse_caddy_data:/data
      - lighthouse_caddy_config:/config
    networks:
      - lighthouse-net
    depends_on:
      - n8n
      - chatwoot-web
      - evolution-api
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
